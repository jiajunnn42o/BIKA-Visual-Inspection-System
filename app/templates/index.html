{% extends "base.html" %}

{% block title %}
BIKA Visual Inspection System
{% endblock %}

{% block content %}

<h1>BIKA Visual Inspection System</h1>

<p>
    Logged in as:
    {{ current_user.full_name }}
</p>

<p>
    Role:
    {{ current_user.role }}
</p>

<p>
    Status:
    {{ current_user.status }}
</p>

<form
    method="POST"
    action="{{ url_for('auth.logout') }}"
>
    <input
        type="hidden"
        name="csrf_token"
        value="{{ csrf_token() }}"
    >

    <button type="submit">
        Logout
    </button>
</form>

{% endblock %}
